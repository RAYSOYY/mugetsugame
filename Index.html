<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="MugetsuGame : jeux multijoueurs entre potes (Enchère, Undercover, Devine le perso) sur l'univers Dragon Ball.">
<title>MugetsuGame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&family=Nunito+Sans:wght@400;600;800&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one centred game column, sticky top bar with room code, cards as the hero object of every phase */
:root{
  --bg:#0a1430; --panel:#112048; --panel2:#17295a; --line:#25407e;
  --fg:#ffffff; --muted:#a9b9de;
  --accent:#e8283c; --accent-ink:#ffffff; --ki:#4d8dff;
  --good:#5bd98f; --bad:#ff5a6e; --gold:#ffffff;
  --f-display:"Bungee","Impact","Arial Black",sans-serif;
  --f-body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  --f-data:"Chakra Petch","Consolas",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:20px;letter-spacing:.02em;line-height:1}
.logo span{color:var(--accent)}
.top .sp{flex:1}
.chip{font-family:var(--f-data);font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--panel)}
.chip b{color:var(--fg)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-size:clamp(30px,7vw,48px);line-height:1.02;font-weight:400}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1}
h3{font-size:15px;font-weight:800}
.lab{font-family:var(--f-data);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero{padding-block:28px 8px;display:flex;flex-direction:column;gap:10px}
.hero p{margin:0;max-width:56ch;color:var(--muted)}
input[type=text],input[type=number],select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0;flex:1}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ki);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:800;cursor:pointer;background:var(--panel2);border:1px solid var(--line)}
.btn:hover{border-color:var(--muted)}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.main:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:7px 12px;font-size:14px}
.err{color:var(--bad);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:620px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.mode .mn{font-family:var(--f-display);font-size:17px}
.mode .mp{font-family:var(--f-data);font-size:12px;color:var(--ki)}
.mode p{margin:0;font-size:14px;color:var(--muted)}
.mode.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mode[disabled]{cursor:default}
.plist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border-radius:10px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:#130d22;position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 5%;background:var(--panel2)}
.av-big{width:44px;height:44px;font-size:16px}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;max-height:340px;overflow-y:auto;padding:4px}
.avpick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;min-width:0}
.avpick img{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:center 5%;background:var(--bg)}
.avpick span{font-size:11px;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.avpick.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.copy{cursor:pointer}
.tag{font-family:var(--f-data);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--line);color:var(--fg)}
.tag.acc{background:var(--accent);color:var(--accent-ink)}
.tag.ki{background:var(--ki);color:#ffffff}
/* cards */
.cards{display:flex;gap:10px;flex-wrap:wrap}
.card{--h:30;width:150px;aspect-ratio:3/4.1;max-width:100%;border-radius:14px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
  background:linear-gradient(160deg,hsl(var(--h) 72% 42%),#0a1430);border:2px solid #ffffff;color:#fff;box-shadow:0 10px 24px -12px hsl(var(--h) 80% 50% / .6)}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
.card{text-shadow:0 1px 3px rgba(0,0,0,.85)}
.card>div{position:relative;z-index:2}
.card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 8%;z-index:0}
.card.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(10,20,48,.55),transparent 25%,transparent 50%,rgba(10,20,48,.95));z-index:1}
.card.has-img .card-ini{visibility:hidden}
.card-top{font-family:var(--f-data);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.card-ini{font-family:var(--f-display);font-size:46px;line-height:1;text-align:center;opacity:.9}
.card-name{font-weight:800;font-size:15px;line-height:1.15;text-wrap:balance}
.card-form{display:inline-block;font-family:var(--f-data);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:#ffffff;color:#0a1430;margin-bottom:3px}
.card-lab{font-family:var(--f-data);font-size:11px;opacity:.85}
.card.big{width:200px}
.card.big .card-ini{font-size:64px}
.card.sm{width:104px;padding:8px;border-radius:10px}
.card.sm .card-ini{font-size:30px}
.card.sm .card-name{font-size:12.5px}
.card.back{background:repeating-linear-gradient(45deg,var(--panel2) 0 10px,var(--panel) 10px 20px);border-color:var(--line);box-shadow:none;color:var(--muted)}
.card.back .card-ini{font-size:56px;color:var(--accent);opacity:1}
.stage{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.stage>.col{flex:1;min-width:220px;display:flex;flex-direction:column;gap:12px}
.big-num{font-family:var(--f-data);font-weight:700;font-size:44px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.timer{font-family:var(--f-data);font-weight:700;font-size:28px;color:var(--ki);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.duo{grid-template-columns:1fr}}
.side{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.side.turn{border-color:var(--accent)}
.side .bud{font-family:var(--f-data);font-weight:700;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.minis{display:flex;flex-wrap:wrap;gap:5px}
.mini{font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--line)}
.mini.free{outline:1px dashed var(--muted);background:transparent}
.slots{font-family:var(--f-data);font-size:13px;color:var(--muted)}
table.cl{width:100%;border-collapse:collapse;font-size:15px}
table.cl td,table.cl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cl th{font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
table.cl tr.cur td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.scroll{overflow-x:auto}
.word{font-family:var(--f-display);font-size:34px;color:var(--gold);line-height:1.1}
.vote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.vbtn{padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-weight:800;text-align:left;display:flex;justify-content:space-between;gap:8px}
.vbtn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel2))}
.vbtn .n{font-family:var(--f-data);color:var(--muted)}
.banner{border-radius:14px;padding:18px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 30%,var(--panel)),var(--panel));border:1px solid var(--accent)}
.banner h2{font-size:26px}
.q{font-size:20px;font-weight:800;line-height:1.3}
.check{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--panel2);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.score{display:flex;gap:8px;flex-wrap:wrap}
.score .s{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:baseline}
.score .s b{font-family:var(--f-data);font-size:20px;color:var(--gold)}
.score .s.cur{border-color:var(--accent)}
.chatlog{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--panel2);border-radius:10px}
.cmsg{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
details summary{cursor:pointer;color:var(--muted);font-weight:600}
details p{margin:.4em 0;color:var(--muted);font-size:14.5px}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.copy{cursor:pointer}
.codebig{font-family:var(--f-data);font-weight:700;font-size:30px;letter-spacing:.18em;color:var(--accent)}
</style>

</head>
<body>

  <div class="logo">MUGETSU<span>GAME</span></div>

</div></div>
<main class="wrap" id="main"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

};
const CLASSIQUE={nom:"Classique (vie de tous les jours)",pairs:[["Micro-ondes", "Four"], ["Café", "Thé"], ["Chat", "Chien"], ["Plage", "Piscine"], ["Avion", "Hélicoptère"], ["Train", "Métro"], ["Guitare", "Violon"], ["Pizza", "Burger"], ["Frigo", "Congélateur"], ["Lit", "Canapé"], ["Fourchette", "Cuillère"], ["Assiette", "Bol"], ["Douche", "Baignoire"], ["Shampoing", "Gel douche"], ["Brosse à dents", "Dentifrice"], ["Stylo", "Crayon"], ["Livre", "Magazine"], ["Téléphone", "Tablette"], ["Ordinateur", "Console"], ["Netflix", "YouTube"], ["Instagram", "TikTok"], ["WhatsApp", "Snapchat"], ["Coca", "Pepsi"], ["McDo", "Burger King"], ["Croissant", "Pain au chocolat"], ["Crêpe", "Gaufre"], ["Glace", "Sorbet"], ["Chocolat", "Bonbon"], ["Pomme", "Poire"], ["Citron", "Orange"], ["Fraise", "Framboise"], ["Tomate", "Poivron"], ["Pâtes", "Riz"], ["Sushi", "Kebab"], ["Ketchup", "Mayonnaise"], ["Sel", "Poivre"], ["Sucre", "Miel"], ["Lait", "Yaourt"], ["Fromage", "Beurre"], ["Vélo", "Trottinette"], ["Voiture", "Moto"], ["Bus", "Tram"], ["Bateau", "Sous-marin"], ["Hôpital", "Pharmacie"], ["Médecin", "Dentiste"], ["Prof", "Directeur"], ["Policier", "Pompier"], ["Boulanger", "Pâtissier"], ["École", "Collège"], ["Cinéma", "Théâtre"], ["Concert", "Festival"], ["Football", "Rugby"], ["Basket", "Volley"], ["Tennis", "Ping-pong"], ["Ski", "Snowboard"], ["Montagne", "Volcan"], ["Forêt", "Jungle"], ["Mer", "Lac"], ["Pluie", "Neige"], ["Soleil", "Lune"], ["Été", "Printemps"], ["Noël", "Anniversaire"], ["Halloween", "Carnaval"], ["Lion", "Tigre"], ["Loup", "Renard"], ["Requin", "Dauphin"], ["Abeille", "Guêpe"], ["Papillon", "Libellule"], ["Poule", "Canard"], ["Vache", "Mouton"], ["Montre", "Bracelet"], ["Lunettes", "Lentilles"], ["Casquette", "Bonnet"], ["Baskets", "Bottes"], ["Jean", "Jogging"], ["Parapluie", "Imperméable"], ["Clé", "Cadenas"], ["Bougie", "Lampe"], ["Miroir", "Fenêtre"], ["Escalier", "Ascenseur"]]};

const UNI_SOON = ["One Piece","Naruto","Jujutsu Kaisen","Demon Slayer"];
const MODES = {
  enchereC:{nom:"Enchère classique",pl:"2 joueurs",min:2,max:99,
    desc:"500 M chacun. Le perso tiré est visible par tout le monde. Fais monter les prix, gère ton budget. Premier à 5 persos, débat, puis vote.",

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function hash(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
function initials(n){const w=n.replace(/[^\p{L}\p{N} ]/gu," ").split(/\s+/).filter(Boolean);return (w.length>1?w[0][0]+w[1][0]:n.slice(0,2)).toUpperCase()}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"")}
const BADCH=new RegExp("[\\u0000-\\u001f\\u200b-\\u200f\\u2028-\\u202e\\ufeff]","g");

/* ===================== LOGIQUE HÔTE ===================== */
function idxOf(peer){return H.pl.findIndex(p=>p.p===peer)}
function fixCfg(){
  const ps=H.pl.map(p=>p.p);
  let [a,b]=H.cfg.e;
  if(!ps.includes(a))a=ps.find(x=>x!==b)??null;
  if(!ps.includes(b)||b===a)b=ps.find(x=>x!==a)??null;
  H.cfg.e=[a,b];
  if(!ps.includes(H.cfg.j))H.cfg.j=me.peer;
}
function canStart(s){
  const n=s.pl.length,m=MODES[s.mode];
  if(m.off)return "Ce mode n'est pas encore jouable.";
  if(s.mode==="enchere"||s.mode==="enchereC"){const[a,b]=s.cfg.e;return a&&b&&a!==b?"":"Il faut 2 joueurs dans le salon."}
  if(n<m.min)return `Il faut au moins ${m.min} joueurs (vous êtes ${n}).`;
  if(n>m.max)return `Maximum ${m.max} joueurs pour ce mode (vous êtes ${n}).`;
  return "";
}
function handle(peer,a){
  const host=peer===me.peer;
  const i=idxOf(peer);
  let ch=false;
  switch(a.t){
    case "mode": if(host&&H.ph==="lobby"&&MODES[a.m]&&!MODES[a.m].off){H.mode=a.m;if(a.m!=="undercover"&&H.uni==="classique")H.uni="db";ch=true}break;
    case "cfgE": if(host&&H.ph==="lobby"){const ps=H.pl.map(p=>p.p);if(ps.includes(a.p)){H.cfg.e[a.k?1:0]=a.p;if(H.cfg.e[0]===H.cfg.e[1])H.cfg.e[a.k?0:1]=ps.find(x=>x!==a.p)??null;ch=true}}break;
    case "uni": if(host&&H.ph==="lobby"&&(a.u==="all"||UNI[a.u]||(a.u==="classique"&&H.mode==="undercover"))){H.uni=a.u;ch=true}break;
    case "cfgJ": if(host&&H.ph==="lobby"&&H.pl.some(p=>p.p===a.p)){H.cfg.j=a.p;ch=true}break;
    case "start": if(host&&H.ph==="lobby"&&!canStart(H)){startGame();ch=true}break;
    case "lobby": if(host){H.ph="lobby";delete H.e;delete H.u;delete H.d;delete H.ends;fixCfg();ch=true}break;
    case "endNow": if(host){ch=forceEnd()}break;
    default: if(i>=0)ch=modeAction(i,a);
  }
  if(ch)publish();
}
function startGame(){
  if(H.mode==="enchere"||H.mode==="enchereC"){
    const a=idxOf(H.cfg.e[0]),b=idxOf(H.cfg.e[1]);
    H.e={vis:H.mode==="enchereC",pp:[a,b],bud:[BUDGET,BUDGET],team:[[],[]],free:[[],[]],turn:rnd(2),used:[],cur:null,last:null,votes:{}};
    H.ph="e_draw";
  }else if(H.mode==="undercover"){
    const order=shuffle(H.pl.map((_,k)=>k));
    const ps=pairsFor(H.uni);
    let w=ps[rnd(ps.length)];if(ps.length>1)while(w.join("|")===H.lastPair)w=ps[rnd(ps.length)];
    H.lastPair=w.join("|");
    H.u={order,w:w.slice(),chat:[],sw:rnd(2),imp:order[rnd(order.length)],r:1,rv:2,i:0,cl:{},votes:{},tie:null,res:null};
    H.ph="u_clue";
  }else{
    const j=idxOf(H.cfg.j);
    const order=shuffle(H.pl.map((_,k)=>k).filter(k=>k!==j));
    const p=shuffle(poolFor(H.uni));const chs={};order.forEach((k,n)=>chs[k]=p[n]);
    H.d={j,order,ch:chs,q:0,cur:null,pts:{},log:[],gs:{},ok:null};
    H.ph="d_ask";
  }
}
function drawChar(used){const p=poolFor(H.uni).filter(c=>!used.includes(c));const c=p[rnd(p.length)];used.push(c);return c}
function modeAction(i,a){
  /* ---- ENCHÈRE ---- */
  if(H.e&&H.ph.startsWith("e_")){
    const e=H.e,side=e.pp.indexOf(i);
    if(H.ph==="e_draw"&&a.t==="draw"&&side===e.turn){
      e.cur={c:drawChar(e.used),bid:0,lead:e.turn,to:e.turn};H.ph="e_open";return true}
    if(H.ph==="e_open"&&a.t==="open"&&side===e.turn){
      const mx=e.bud[side],mn=Math.min(MINBID,mx);let v=Math.round(+a.v||0);
      if(!(v>=mn&&v<=mx))return false;
      e.cur.bid=v;e.cur.lead=side;e.cur.to=1-side;H.ph="e_bid";return true}
    if(H.ph==="e_bid"&&side===e.cur.to){
      if(a.t==="raise"){let v=Math.round(+a.v||0);if(!(v>=e.cur.bid+MINBID&&v<=e.bud[side]))return false;
        e.cur.bid=v;e.cur.lead=side;e.cur.to=1-side;return true}
      if(a.t==="pass"){const w=e.cur.lead;e.bud[w]-=e.cur.bid;e.team[w].push(e.cur.c);
        e.last={c:e.cur.c,w,p:e.cur.bid};e.cur=null;
        if(e.team[0].length>=TEAM||e.team[1].length>=TEAM){
          e.turn=e.team[0].length>=TEAM?1:0;H.ph="e_fdraw";
        }else{e.turn=1-e.turn;H.ph="e_draw"}
        return true}
    }
    if(H.ph==="e_fdraw"&&a.t==="draw"&&side===e.turn){e.cur={c:drawChar(e.used)};H.ph="e_ftake";return true}
    if(H.ph==="e_ftake"&&a.t==="take"&&side===e.turn){
      e.team[side].push(e.cur.c);e.free[side].push(e.cur.c);e.last={c:e.cur.c,w:side,p:0,f:1};e.cur=null;
      if(e.team[side].length>=TEAM){H.ph="e_vote";H.ends=Date.now()+T_E}else H.ph="e_fdraw";
      return true}
    if(H.ph==="e_vote"&&a.t==="vote"&&(a.w===0||a.w===1)){e.votes[i]=a.w;return true}
    return false;
  }
  /* ---- UNDERCOVER ---- */
  if(H.u&&H.ph.startsWith("u_")){
    const u=H.u;
    if(H.ph==="u_clue"&&a.t==="clue"&&u.order[u.i]===i){
      const w=clip(a.w,20);if(!w)return false;
      (u.cl[i]=u.cl[i]||[]).push(w);u.i++;
      if(u.i>=u.order.length){if(u.r<u.rv){u.r++;u.i=0}else{H.ph="u_vote";H.ends=Date.now()+T_U}}
      return true}
    if(H.ph==="u_vote"&&a.t==="vote"&&u.order.includes(i)&&u.order.includes(a.v)&&a.v!==i){
      u.votes[i]=a.v;
      if(u.order.every(k=>u.votes[k]!==undefined))finishU();
      return true}
    return false;
  }
  /* ---- DEVINE ---- */
  if(H.d&&H.ph.startsWith("d_")){
    const d=H.d,n=d.order.length;
    if(H.ph==="d_ask"&&a.t==="ask"&&d.order[d.q%n]===i){
      const t=clip(a.q,80)||"Question posée à l'oral";d.cur={a:i,t};H.ph="d_judge";return true}
    if(H.ph==="d_ask"&&a.t==="askSkip"&&d.order[d.q%n]===i){
      d.log.push({a:i,t:"A passé son tour",w:[]});d.log=d.log.slice(-4);d.q++;
      H.ph=d.q>=QPP*n?"d_guess":"d_ask";return true}
    if(H.ph==="d_judge"&&a.t==="judge"&&i===d.j){
      const w=(Array.isArray(a.w)?a.w:[]).filter(k=>d.order.includes(k));
      w.forEach(k=>d.pts[k]=(d.pts[k]||0)+1);
      d.log.push({a:d.cur.a,t:d.cur.t,w});d.log=d.log.slice(-4);d.cur=null;d.q++;
      H.ph=d.q>=QPP*n?"d_guess":"d_ask";return true}
    if(H.ph==="d_guess"&&a.t==="guess"&&d.order.includes(i)&&!d.gs[i]){
      const g={};for(const k of d.order){if(k===i)continue;const v=clip(a.g&&a.g[k],30);if(v)g[k]=v}
      d.gs[i]=g;
      if(d.order.every(k=>d.gs[k]))H.ph="d_val";
      return true}
    if(H.ph==="d_val"&&a.t==="val"&&i===d.j){
      const ok=(Array.isArray(a.ok)?a.ok:[]).filter(s=>{const[g,t]=String(s).split("-").map(Number);return d.gs[g]&&d.gs[g][t]!==undefined});
      d.ok=ok;H.ph="d_end";return true}
    return false;
  }
  return false;
}
function finishU(){
  const u=H.u,t={};
  for(const k of u.order){const v=u.votes[k];if(v!==undefined)t[v]=(t[v]||0)+1}
  let max=0,top=[];for(const k in t){if(t[k]>max){max=t[k];top=[+k]}else if(t[k]===max)top.push(+k)}
  if(top.length!==1){
    u.tie=top;u.votes={};u.r++;u.rv=u.r;u.i=0;H.ph="u_clue";delete H.ends;return;
  }
  const out=top[0];
  u.res={t,out,win:out===u.imp?"civils":"imposteur"};H.ph="u_end";delete H.ends;
}
function finishE(){H.ph="e_end";delete H.ends}
function forceEnd(){
  if(H.ph==="e_vote"){finishE();return true}
  if(H.ph==="u_vote"){finishU();return true}
  if(H.ph==="d_guess"){for(const k of H.d.order)if(!H.d.gs[k])H.d.gs[k]={};H.ph="d_val";return true}
  return false;
}
setInterval(()=>{
  if(!isHost||!H||!H.ends)return;
  if(Date.now()>=H.ends){
    if(H.ph==="e_vote")finishE();else if(H.ph==="u_vote")finishU();
    publish();
  }
},500);

function copyCode(){
  const t=(code||"").toUpperCase();if(!t)return;
  const done=()=>{ui.copied=Date.now();render();setTimeout(()=>{if(Date.now()-ui.copied>=1900){ui.copied=0;render()}},2000)};
  const fallback=()=>{try{const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();done()}catch{}};
  try{navigator.clipboard.writeText(t).then(done,fallback)}catch{fallback()}
}
const IMG_EXT=["webp","jpg","png"],imgOk={};
function slug(n){return String(n).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
function imgLoad(el){imgOk[el.dataset.s]=IMG_EXT[+el.dataset.e];el.parentNode&&el.parentNode.classList.add("has-img")}
function imgNext(el){const i=+el.dataset.e+1;if(i<IMG_EXT.length){el.dataset.e=i;el.src="images/"+el.dataset.s+"."+IMG_EXT[i]}else{imgOk[el.dataset.s]=false;el.remove()}}
function imgTag(n){
  const s=slug(n),k=imgOk[s];
  if(k===false)return "";
  const e=typeof k==="string"?IMG_EXT.indexOf(k):0;
  return `<img class="card-img" src="images/${s}.${IMG_EXT[e]}" data-s="${s}" data-e="${e}" alt="" onload="imgLoad(this)" onerror="imgNext(this)">`;
}
function card(cid,size="",lab=""){
  const n=charName(cid),m=n.match(/^(.*?)\s*\((.+)\)$/),base=m?m[1]:n,form=m?m[2]:"";
  const has=typeof imgOk[slug(n)]==="string";
  return `<div class="card ${size}${has?" has-img":""}" style="--h:${hash(base)%2?222:354}">${imgTag(n)}<div class="card-top">${esc(uniName(cid))}</div><div class="card-ini">${esc(initials(base))}</div><div>${form?`<span class="card-form">${esc(form)}</span>`:""}<div class="card-name">${esc(base)}</div>${lab?`<div class="card-lab">${esc(lab)}</div>`:""}</div></div>`;
}
function cardBack(lab="",size=""){return `<div class="card back ${size}"><div class="card-top">Secret</div><div class="card-ini">?</div><div class="card-name">${esc(lab)}</div></div>`}
function timer(){return st.ends?`<span class="timer" data-ends="${st.ends}">--:--</span>`:""}
function rulesBox(m){return `<details><summary>Règles du mode ${esc(MODES[m].nom)}</summary>${MODES[m].rules.map(r=>`<p>${esc(r)}</p>`).join("")}</details>`}
function hostFoot(){

function render(){
  // préserver les champs en cours de saisie
  const keep={};let focus=null,sel=null;
  document.querySelectorAll("#main input[type=text],#main input[type=number]").forEach(el=>{if(el.id)keep[el.id]=el.value});
  const ae=document.activeElement;if(ae&&ae.id&&$("#main").contains(ae)){focus=ae.id;try{sel=[ae.selectionStart,ae.selectionEnd]}catch{}}
  $("#topinfo").innerHTML=topInfo();
  $("#main").innerHTML=view();
  for(const id in keep){const el=document.getElementById(id);if(el&&keep[id]!=="")el.value=keep[id]}
  const cl=document.getElementById("chatlog");if(cl)cl.scrollTop=cl.scrollHeight;
  if(focus){const el=document.getElementById(focus);if(el){el.focus();try{sel&&el.setSelectionRange(sel[0],sel[1])}catch{}}}
  tick();
}

/* ---------- ENCHÈRE ---------- */
function viewE(){
  const e=st.e,mi=myIdx(),side=e.pp.indexOf(mi),ph=st.ph;
  const sideBox=k=>{const p=e.pp[k];const turn=["e_draw","e_open","e_fdraw","e_ftake"].includes(ph)&&e.turn===k||ph==="e_bid"&&e.cur.to===k;
    return `<div class="side ${turn?"turn":""}"><div class="row">${avi(p)}<h3 style="flex:1;min-width:0">${esc(nm(p))}${k===side?" (toi)":""}</h3></div>
    <div class="bud">${fmtM(e.bud[k])}</div><div class="slots">Équipe ${e.team[k].length}/${TEAM}</div>
    <div class="minis">${e.team[k].map(c=>`<span class="mini ${e.free[k].includes(c)?"free":""}">${esc(charName(c))}</span>`).join("")||`<span class="muted" style="font-size:13px">Personne encore</span>`}</div></div>`};
  let center="";
  const drawer=e.pp[e.turn],other=e.pp[1-e.turn];
  if(ph==="e_draw"){
    const last=e.last?`<p class="muted" style="margin:0"><b>${esc(nm(e.pp[e.last.w]))}</b> a remporté <b>${esc(charName(e.last.c))}</b> pour ${fmtM(e.last.p)}.</p>`:"";
    center=`<div class="stage">${e.last?card(e.last.c,"","Dernier achat"):cardBack("En attente")}<div class="col">${last}
      ${side===e.turn?`<h2>À toi de tirer</h2><p class="muted" style="margin:0">${e.vis?"Le perso sera visible par tout le monde.":"Tu seras le seul à voir le perso."}</p><div><button class="btn main" data-a="eDraw">Tirer un perso</button></div>`
      :`<h2 class="pulse">${esc(nm(drawer))} va tirer un perso</h2>`}</div></div>`;
  }else if(ph==="e_fdraw"||ph==="e_ftake"){
    const left=TEAM-e.team[e.turn].length,mine=side===e.turn;
    const info=`<p class="muted" style="margin:0"><b>${esc(nm(e.pp[1-e.turn]))}</b> a son équipe complète. ${mine?"Tu":esc(nm(drawer))} complète${mine?"s":""} la tienne gratuitement, sans enchère : encore ${left} perso${left>1?"s":""}.</p>`;
    if(ph==="e_fdraw"){
      const last=e.last&&e.last.f?card(e.last.c,"","Dernier reçu"):e.last?card(e.last.c,"","Dernier achat"):cardBack("En attente");
      center=`<div class="stage">${last}<div class="col">${info}${mine?`<h2>Tire ton prochain perso</h2><div><button class="btn main" data-a="eDraw">Tirer un perso</button></div>`:`<h2 class="pulse">${esc(nm(drawer))} tire un perso</h2>`}</div></div>`;
    }else{
      center=`<div class="stage">${card(e.cur.c,"big","Gratuit")}<div class="col">${info}${mine?`<h2>Pas le choix, il est à toi</h2><div><button class="btn main" data-a="eTake">Prendre</button></div>`:`<h2 class="pulse">${esc(nm(drawer))} récupère ${esc(charName(e.cur.c))}</h2>`}</div></div>`;
    }
  }else if(ph==="e_open"){
    const mx=e.bud[e.turn],mn=Math.min(MINBID,mx);
    center=side===e.turn?`<div class="stage">${card(e.cur.c,"big",e.vis?"Visible par tous":"Toi seul le vois")}<div class="col"><h2>Lance l'enchère</h2>
      <p class="muted" style="margin:0">Mise de départ entre ${fmtM(mn)} et ${fmtM(mx)}.${e.vis?"":" Tu peux bluffer."}</p>
      <div class="row"><input type="number" id="eopen" min="${mn}" max="${mx}" step="10" value="${mn}"><button class="btn main" data-a="eOpen">Miser</button></div></div></div>`
      :`<div class="stage">${e.vis?card(e.cur.c,"big","Tiré par "+nm(drawer)):cardBack("Perso secret","big")}<div class="col"><h2 class="pulse">${esc(nm(drawer))} ${e.vis?"choisit sa mise de départ…":"regarde son perso…"}</h2><p class="muted" style="margin:0">Prépare-toi à surenchérir ou à passer.</p></div></div>`;
  }else if(ph==="e_bid"){
    const to=e.cur.to,need=e.cur.bid+MINBID,can=e.bud[to]>=need;
    const cardHtml=e.vis?card(e.cur.c,"big","Tiré par "+nm(drawer)):side===e.turn?card(e.cur.c,"big","Toi seul le vois"):cardBack("Tiré par "+nm(drawer),"big");
    center=`<div class="stage">${cardHtml}<div class="col">
      <span class="lab">Mise actuelle</span><div class="big-num">${fmtM(e.cur.bid)}</div>
      <p class="muted" style="margin:0">Meneur : <b>${esc(nm(e.pp[e.cur.lead]))}</b></p>

        <div><button class="btn" data-a="ePass">Je passe (${esc(nm(e.pp[e.cur.lead]))} remporte)</button></div>`
      :`<p class="pulse" style="margin:0">Au tour de <b>${esc(nm(e.pp[to]))}</b>…</p>`}

    if(ph==="e_vote"){
      const my=e.votes[mi];
      center=`<div class="row" style="justify-content:space-between"><h2>Débat : quelle équipe gagne ?</h2>${timer()}</div>${teams}
      <div class="stack"><span class="lab">Ton vote</span><div class="vote-grid">${[0,1].map(k=>`<button class="vbtn ${my===k?"on":""}" data-a="eVote" data-w="${k}">${esc(nm(e.pp[k]))}<span class="n">${v[k]}</span></button>`).join("")}</div>

    }
  }
  return `<div class="row" style="justify-content:space-between"><h2>${e.vis?"Enchère classique":"Enchère mystère"}</h2><span class="lab">${side<0?"Spectateur":"Joueur"}</span></div>

    <div class="panel stack">${center}</div>${rulesBox(e.vis?"enchereC":"enchere")}`;
}

/* ---------- UNDERCOVER ---------- */
function wordFeed(u,mi,ph){
  const cur=ph==="u_clue"?u.order[u.i]:-1;
  let rows="";
  for(let r=0;r<u.rv;r++){
    const items=u.order.filter(k=>(u.cl[k]||[])[r]!==undefined);
    if(!items.length&&!(ph==="u_clue"&&u.r===r+1))continue;
    rows+=`<div class="lab" style="margin-top:4px">Tour ${r+1}</div>`;
    rows+=items.map(k=>`<div class="cmsg row" style="gap:8px;flex-wrap:nowrap">${avi(k)}<span style="min-width:0"><b>${esc(nm(k))}</b>${k===mi?" (toi)":""}${ph==="u_end"&&k===u.imp?` <span class="tag acc">Imposteur</span>`:""} : ${esc(u.cl[k][r])}</span></div>`).join("");
  }
  if(!rows)rows=`<p class="muted" style="margin:0;font-size:14px">Les mots de chaque joueur apparaîtront ici.</p>`;
  let foot="";
  if(ph==="u_clue"){
    foot=cur===mi
      ?`<div class="stack" style="gap:8px"><b>À toi ! Donne un mot en rapport avec le tien.</b><div class="row"><input type="text" id="uclue" maxlength="20" placeholder="Ton mot…"><button class="btn main" data-a="uClue">Envoyer</button></div></div>`
      :`<p class="pulse" style="margin:0"><b>${esc(nm(cur))}</b> réfléchit à son mot…</p>`;
  }
  return `<div class="panel stack"><span class="lab">Fil des mots</span><div class="chatlog" id="chatlog">${rows}</div>${foot}</div>`;
}
function viewU(){
  const u=st.u,mi=myIdx(),ph=st.ph,pair=u.w||["?","?"];
  const wordOf=k=>pair[k===u.imp?1-u.sw:u.sw];

  const myWord=inGame?`<div class="panel row" style="justify-content:space-between"><div><span class="lab">Ton mot secret</span><div class="word">${esc(wordOf(mi))}</div></div><p class="muted" style="margin:0;max-width:30ch;font-size:14px">Ne le dis pas. L'imposteur a un mot différent et ne sait pas qu'il l'est.</p></div>`:"";
  const table=`<div class="scroll"><table class="cl"><thead><tr><th>Joueur</th>${Array.from({length:u.rv},(_,r)=>`<th>Tour ${r+1}</th>`).join("")}</tr></thead><tbody>${u.order.map((k,n)=>{

  let center="";
  if(ph==="u_clue"){
    const cur=u.order[u.i];
    const tie=u.tie&&u.r>2?`<div class="banner"><span class="lab">Égalité au vote</span><h2>Nouveau tour d'indices</h2><p style="margin:.3em 0 0">${u.tie.length?"Égalité entre "+u.tie.map(k=>`<b>${esc(nm(k))}</b>`).join(", ")+".":"Personne n'a voté."} Chacun redonne un mot, puis on revote.</p></div>`:"";
    center=tie+(cur===mi?`<h3>Tour ${u.r} : c'est à toi !</h3><p class="muted" style="margin:0">Écris ton mot dans le fil des mots, juste en dessous.</p>`

  }else if(ph==="u_vote"){
    const my=u.votes[mi],nv=Object.keys(u.votes).length;
    center=`<div class="row" style="justify-content:space-between"><h3>Qui est l'imposteur ?</h3>${timer()}</div>
      ${inGame?`<div class="vote-grid">${u.order.filter(k=>k!==mi).map(k=>`<button class="vbtn ${my===k?"on":""}" data-a="uVote" data-v="${k}">${esc(nm(k))}</button>`).join("")}</div>`:""}
      <p class="muted" style="margin:0">${nv}/${u.order.length} ont voté. Le vote se valide à la fin du chrono, ou quand tout le monde a voté.</p>`;
  }else{
    const r=u.res;
    center=`<div class="banner"><span class="lab">Fin de partie</span><h2>${r.win==="civils"?"Les civils gagnent !":"L'imposteur gagne !"}</h2>
      <p style="margin:.3em 0 0">L'imposteur était <b>${esc(nm(u.imp))}</b>. ${`Le plus voté : <b>${esc(nm(r.out))}</b>.`}</p></div>
      <div class="duo"><div class="side"><span class="lab">Mot des civils</span><div class="word">${esc(pair[u.sw])}</div></div><div class="side"><span class="lab">Mot de l'imposteur</span><div class="word">${esc(pair[1-u.sw])}</div></div></div>
      <div class="score">${u.order.map(k=>`<div class="s"><span>${esc(nm(k))}</span><b>${r.t[k]||0}</b></div>`).join("")}</div>`;
  }
  return `<div class="row" style="justify-content:space-between"><h2>Undercover</h2><span class="lab">${esc(uniLabel(st.uni))}</span></div>
    ${ph==="u_end"?"":myWord}<div class="panel stack">${center}</div>${wordFeed(u,mi,ph)}${rulesBox("undercover")}`;
}

/* ---------- DEVINE LE PERSO ---------- */
function viewD(){
  const d=st.d,mi=myIdx(),ph=st.ph,n=d.order.length,isJ=mi===d.j,isP=d.order.includes(mi);
  const zeroed=new Set((d.ok||[]).map(s=>+String(s).split("-")[1]));
  const finalPts=k=>zeroed.has(k)?0:(d.pts[k]||0);
  const asker=d.order[d.q%n];
  const score=`<div class="score">${d.order.map(k=>`<div class="s ${(ph==="d_ask"||ph==="d_judge")&&k===asker?"cur":""}"><span>${esc(nm(k))}${k===mi?" (toi)":""}</span><b>${ph==="d_end"?finalPts(k):(d.pts[k]||0)}</b></div>`).join("")}</div>`;
  const role=isJ?`<span class="tag ki">Juge</span>`:isP?`<span class="tag acc">Joueur</span>`:`<span class="tag">Spectateur</span>`;
  let mine="";
  if(isP&&ph!=="d_end")mine=`<div class="panel stage">${card(d.ch[mi],"","Ton perso secret")}<div class="col"><p class="muted" style="margin:0">Défends ton perso avec tes questions. Les autres ne le voient pas, le juge si.</p></div></div>`;
  if(isJ&&ph!=="d_end")mine=`<div class="panel stack"><span class="lab">Ce que toi seul vois (juge)</span><div class="cards">${d.order.map(k=>card(d.ch[k],"sm",nm(k))).join("")}</div></div>`;
  let center="";
  if(ph==="d_ask"){
    center=`<span class="lab">Question ${d.q+1} / ${QPP*n}</span>`+(asker===mi
      ?`<h3>À toi de poser ta question</h3><p class="muted" style="margin:0">Pose-la à l'oral, puis valide. Tu peux aussi l'écrire si tu veux.</p><div class="row"><input type="text" id="dask" maxlength="80" placeholder="Facultatif : ex. Mon perso est le plus beau"><button class="btn main" data-a="dAsk">Question posée</button><button class="btn ghost" data-a="dAskSkip">Passer mon tour</button></div>`
      :`<p class="pulse" style="margin:0"><b>${esc(nm(asker))}</b> prépare sa question…</p>`);
  }else if(ph==="d_judge"){
    center=`<span class="lab">${esc(nm(d.cur.a))} demande</span><div class="q">« ${esc(d.cur.t)} »</div>`+(isJ
      ?`<p class="muted" style="margin:0">Coche le ou les joueurs qui méritent le point (ou personne).</p><div class="stack">${d.order.map(k=>`<label class="check"><input type="checkbox" id="dj-${k}" value="${k}"><span style="flex:1">${esc(nm(k))}</span><span class="muted">${esc(charName(d.ch[k]))}</span></label>`).join("")}</div><div class="row"><button class="btn main" data-a="dJudge">Donner les points</button><button class="btn ghost" data-a="dJudgeSkip">Passer (aucun point)</button></div>`
      :`<p class="pulse" style="margin:0">Le juge <b>${esc(nm(d.j))}</b> décide…</p>`);
  }else if(ph==="d_guess"){
    const sent=Object.keys(d.gs).length;
    if(isP&&!d.gs[mi]){
      center=`<h3>Devine les persos des autres</h3><p class="muted" style="margin:0">Bonne réponse = ses points tombent à 0. Laisse vide si tu ne sais pas.</p>
      <div class="stack">${d.order.filter(k=>k!==mi).map(k=>`<div class="row"><span style="min-width:110px">${esc(nm(k))}</span><input type="text" id="dg-${k}" maxlength="30" placeholder="Son perso ?"></div>`).join("")}</div><div><button class="btn main" data-a="dGuess">Envoyer mes réponses</button></div>`;
    }else center=`<p class="pulse" style="margin:0">Les joueurs devinent… (${sent}/${n} ont envoyé)</p>`;
  }else if(ph==="d_val"){
    if(isJ){
      const rows=[];
      for(const g of d.order)for(const t in (d.gs[g]||{})){const txt=d.gs[g][t],real=charName(d.ch[t]);const auto=norm(txt)&&(norm(real).includes(norm(txt))||norm(txt).includes(norm(real)));rows.push({key:g+"-"+t,g,t:+t,txt,real,auto})}
      center=`<h3>Valide les bonnes réponses</h3>${rows.length?`<div class="stack">${rows.map(r=>`<label class="check"><input type="checkbox" id="dv-${r.key}" value="${r.key}" ${r.auto?"checked":""}><span style="flex:1;min-width:0"><b>${esc(nm(r.g))}</b> pense que ${esc(nm(r.t))} est « ${esc(r.txt)} »</span><span class="muted">${esc(r.real)}</span></label>`).join("")}</div>`:`<p class="muted" style="margin:0">Personne n'a tenté de réponse.</p>`}<div><button class="btn main" data-a="dVal">Valider et voir le résultat</button></div>`;
    }else center=`<p class="pulse" style="margin:0">Le juge vérifie les réponses…</p>`;
  }else{
    const rank=d.order.slice().sort((a,b)=>finalPts(b)-finalPts(a));
    const best=finalPts(rank[0]),winners=rank.filter(k=>finalPts(k)===best);
    center=`<div class="banner"><span class="lab">Fin de partie</span><h2>${winners.length>1?"Égalité : "+winners.map(k=>esc(nm(k))).join(", "):esc(nm(winners[0]))+" gagne !"}</h2><p style="margin:.3em 0 0">${best} point(s)</p></div>
      <div class="cards">${d.order.map(k=>card(d.ch[k],"sm",nm(k)+(zeroed.has(k)?" · démasqué":""))).join("")}</div>`;
  }
  const log=d.log.length&&ph!=="d_end"?`<div class="panel stack"><span class="lab">Dernières questions</span>${d.log.slice().reverse().map(l=>`<div><b>${esc(nm(l.a))}</b> : « ${esc(l.t)} » <span class="muted">→ ${l.w.length?l.w.map(k=>esc(nm(k))).join(", "):"personne"}</span></div>`).join("")}</div>`:"";
  return `<div class="row" style="justify-content:space-between"><h2>Devine le perso</h2>${role}</div>${score}${mine}<div class="panel stack">${center}</div>${log}${rulesBox("devine")}`;
}

/* ===================== ÉVÉNEMENTS ===================== */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT")return;
  const a=b.dataset.a;
  const num=id=>Math.round(+($("#"+id)?.value||0));
  switch(a){
    case "create": createRoom();break;
    case "join": joinRoom();break;
    case "leave": if(isHost&&st){ui.confirmLeave=true;render()}else leave();break;
    case "leaveYes": leave();break;
    case "leaveNo": ui.confirmLeave=false;render();break;
    case "rejoin": joinRoom(b.dataset.c);break;
    case "copy": copyCode();break;
    case "pickOpen": ui.pick=true;render();break;
    case "pickClose": ui.pick=false;ui.q="";render();break;
    case "pickNone": setAvatar("");break;
    case "pickAv": setAvatar(b.dataset.s);break;
    case "mode": act("mode",{m:b.dataset.m});break;
    case "start": act("start");break;
    case "askLobby": ui.confirmLobby=true;render();break;
    case "noLobby": ui.confirmLobby=false;render();break;
    case "lobby": ui.confirmLobby=false;act("lobby");break;
    case "endNow": act("endNow");break;
    case "eDraw": act("draw");break;
    case "eOpen": act("open",{v:num("eopen")});break;
    case "eRaise": act("raise",{v:num("eraise")});break;
    case "ePass": act("pass");break;
    case "eTake": act("take");break;
    case "eVote": act("vote",{w:+b.dataset.w});break;
    case "uClue": {const el=$("#uclue");const w=clip(el?.value,20);if(!w)return;el.value="";act("clue",{w});break}
    case "uVote": act("vote",{v:+b.dataset.v});break;
    case "dAsk": {const el=$("#dask");const q=clip(el?.value,80);if(el)el.value="";act("ask",{q});break}
    case "dAskSkip": act("askSkip");break;
    case "dJudgeSkip": act("judge",{w:[]});break;
    case "dJudge": {const w=[...document.querySelectorAll("[id^=dj-]:checked")].map(x=>+x.value);act("judge",{w});break}
    case "dGuess": {const g={};document.querySelectorAll("[id^=dg-]").forEach(x=>{const v=clip(x.value,30);if(v)g[x.id.slice(3)]=v;x.value=""});act("guess",{g});break}
    case "dVal": {const ok=[...document.querySelectorAll("[id^=dv-]:checked")].map(x=>x.value);act("val",{ok});break}
  }
});
document.addEventListener("input",e=>{if(e.target.id==="avq"){ui.q=e.target.value;render()}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.a==="cfgE")act("cfgE",{k:+t.dataset.k,p:t.value});
  if(t.dataset.a==="cfgJ")act("cfgJ",{p:t.value});
  if(t.dataset.a==="uni")act("uni",{u:t.value});
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const id=e.target.id;
  const map={myname:"create",joincode:"join",uclue:"uClue",dask:"dAsk",eopen:"eOpen",eraise:"eRaise"};
  if(id==="myname"&&G)return;
  if(map[id]){e.preventDefault();document.querySelector(`[data-a="${map[id]}"]`)?.click()}
});
function tick(){
  document.querySelectorAll("[data-ends]").forEach(el=>{
    const left=Math.max(0,+el.dataset.ends-(Date.now()+(isHost?0:offset)));
    const s=Math.ceil(left/1000);el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
    el.classList.toggle("low",s<=15);
  });
}
setInterval(tick,250);
render();
</script>
